services:
  db:
    image: postgis/postgis:16-3.4   # creates the postgis extension in POSTGRES_DB
    environment:
      POSTGRES_USER: plotcheck
      POSTGRES_PASSWORD: plotcheck
      POSTGRES_DB: plotcheck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plotcheck -d plotcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
